<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Leave Application - Anna University Regional Campus Tirunelveli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bar { background: #0d2c54; color: white; padding: 25px 0; border-bottom: 4px solid #b8860b; }
        .form-card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #0d2c54; border-bottom: 2px solid #e9ecef; padding-bottom: 8px; margin-bottom: 18px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-bar text-center mb-4">
        <h4 class="fw-bold mb-1">ANNA UNIVERSITY REGIONAL CAMPUS TIRUNELVELI</h4>
        <h6 class="text-warning mb-0">Student Hostel E-Leave Application Form</h6>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card form-card p-4 p-md-5 bg-white">
                    <form action="/apply-leave" method="POST" enctype="multipart/form-data">
                        
                        <!-- 1. Student Identity -->
                        <div class="section-title"><i class="bi bi-person-circle me-1"></i> Student Information</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Full Name</label>
                                <input type="text" name="student_name" class="form-control" required placeholder="e.g. A. Kumar">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Register Number</label>
                                <input type="text" name="register_no" class="form-control text-uppercase" placeholder="e.g. 24AIDS001" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Hostel</label>
                                <select name="hostel_id" class="form-select" required>
                                    <option value="">-- Select Hostel --</option>
                                    {% for h in hostels %}
                                        <option value="{{ h.hostel_id }}">{{ h.hostel_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Department</label>
                                <select name="department_id" class="form-select" required>
                                    <option value="">-- Select Department --</option>
                                    {% for d in departments %}
                                        <option value="{{ d.department_id }}">{{ d.department_name }} ({{ d.department_code }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Room Number</label>
                                <input type="text" name="room_no" class="form-control" placeholder="e.g. 204" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Year of Study</label>
                                <select name="year_of_study" class="form-select" required>
                                    <option value="1">1st Year</option>
                                    <option value="2">2nd Year</option>
                                    <option value="3">3rd Year</option>
                                    <option value="4">4th Year</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Semester</label>
                                <input type="number" name="semester" class="form-control" min="1" max="8" required placeholder="e.g. 4">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Student Mobile Phone</label>
                                <input type="tel" name="student_phone" class="form-control" placeholder="10-digit number" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Student Email</label>
                                <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
                            </div>
                        </div>

                        <!-- 2. Parent Particulars -->
                        <div class="section-title"><i class="bi bi-people me-1"></i> Parent / Guardian Details</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Father's Name</label>
                                <input type="text" name="father_name" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Mother's Name</label>
                                <input type="text" name="mother_name" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Parent Contact Number</label>
                                <input type="tel" name="parent_contact" class="form-control" required placeholder="10-digit number">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Residential City / Address</label>
                                <textarea name="home_address" class="form-control" rows="1" placeholder="Permanent home address" required></textarea>
                            </div>
                        </div>

                        <!-- 3. Leave Particulars -->
                        <div class="section-title"><i class="bi bi-calendar3 me-1"></i> Leave Details</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Application Type</label>
                                <select name="application_type" id="appType" class="form-select" onchange="toggleProofField()" required>
                                    <option value="WEEKEND">Weekend Leave</option>
                                    <option value="WORKING_DAY">Working-Day Leave</option>
                                    <option value="OUTING">Outing</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">From Date</label>
                                <input type="date" name="from_date" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">To Date</label>
                                <input type="date" name="to_date" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Destination</label>
                                <input type="text" name="destination" class="form-control" placeholder="e.g. Home, Madurai">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Purpose of Leave</label>
                                <input type="text" name="purpose" class="form-control" placeholder="e.g. Family Event / Sibling Wedding" required>
                            </div>

                            <!-- Conditional upload: only visible for WORKING_DAY -->
                            <div class="col-12" id="proofUpload" style="display: none;">
                                <div class="alert alert-warning border border-warning">
                                    <label class="form-label fw-bold text-dark mb-1">
                                        <i class="bi bi-paperclip"></i> Class Advisor & HOD Signed Permission Proof (PDF or Image)
                                    </label>
                                    <input type="file" name="advisor_hod_proof" class="form-control">
                                    <small class="text-muted d-block mt-1">
                                        *Required when applying for leave on working days.
                                    </small>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase">
                                Submit E-Leave Request
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript to toggle file input -->
    <script>
        function toggleProofField() {
            var selected = document.getElementById('appType').value;
            var proofDiv = document.getElementById('proofUpload');
            proofDiv.style.display = (selected === 'WORKING_DAY') ? 'block' : 'none';
        }
    </script>
</body>
</html>
